<!-- todo/templates/registration/password_reset.html -->
{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8 mt-10">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Reset Password</h1>
    
    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <div>
            <label for="id_email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" id="id_email" 
                   class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                   required>
        </div>
        
        <div class="flex items-center justify-between">
            <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-300">
                Send Reset Link
            </button>
        </div>
    </form>
    
    <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
            Remember your password? 
            <a href="{% url 'login' %}" class="text-blue-600 hover:text-blue-800">Login</a>
        </p>
    </div>
</div>
{% endblock %}
