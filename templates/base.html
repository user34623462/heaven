<!-- todo/templates/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}To-Do List{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="{% url 'task_list' %}" class="text-2xl font-bold">To-Do App</a>
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <span class="font-medium">Hello, {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="px-3 py-2 rounded hover:bg-blue-700">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="px-3 py-2 rounded hover:bg-blue-700">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
